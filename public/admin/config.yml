backend:
  name: github
  repo: TreySpooner65/KA0MED-Website
  branch: main
media_folder: public/uploads
public_folder: /KA0MED-Website/uploads
site_url: https://treyspooner65.github.io/KA0MED-Website
display_url: https://treyspooner65.github.io/KA0MED-Website
logo_url: /KA0MED-Website/favicon.svg
collections:
  - name: editorial
    label: Writing
    folder: src/content/editorial
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Summary, name: description, widget: text}
      - {label: Section, name: category, widget: select, options: [Review, Technical Article]}
      - {label: Publish Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false}
      - {label: Featured, name: featured, widget: boolean, default: false}
      - {label: Hero Image, name: image, widget: image, required: false}
      - {label: Tags, name: tags, widget: list, required: false}
      - {label: Article, name: body, widget: markdown}
  - name: encyclopedia
    label: Encyclopedia
    folder: src/content/encyclopedia
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Term, name: title, widget: string}
      - {label: Short Definition, name: description, widget: text}
      - {label: Letter, name: letter, widget: string, pattern: ['^[A-Z]$', 'One capital letter']}
      - {label: Category, name: category, widget: string}
      - {label: Alternate Names, name: aliases, widget: list, required: false}
      - {label: Full Explanation, name: body, widget: markdown}
